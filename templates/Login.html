<!DOCTYPE html>
<html>
<head>
    <title>Create a Banterbird Account</title>
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    <form action="{{ url_for('confirm_login')}}", method="post" style="border:1px solid #ccc">
        <div class="container">
          <h1>Login</h1>
          <p>Please fill in this form to login to an account.</p>
          <hr>
      
          <label for="username"><b>username</b></label>
          <input type="text" placeholder="Enter Email" name="username" required>
      
          <label for="psw"><b>Password</b></label>
          <input type="password" placeholder="Enter Password" name="psw" required>
      
          <label>
            <input type="checkbox" checked="checked" name="remember" style="margin-bottom:15px"> Remember me
          </label>

          <p>haven't created account <a href="{{url_for('signUp')}}" style="color:dodgerblue">Sign up</a>.</p>
      
          <div class="clearfix">
            <button type="submit" class="signupbtn">Login</button>
          </div>
        </div>
      </form>
</body>
</html>
